<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Instalação · Itália RH</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:#090B0A; color:#ECE8DF; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  form { width:100%; max-width:400px; background:#101412; border:1px solid rgba(255,255,255,.08);
    border-radius:20px; padding:26px 22px; }
  h1 { font-family:Georgia,serif; font-weight:400; font-size:22px; margin:0 0 18px; }
  label { display:block; margin:14px 0 6px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#8E9A93; }
  input { width:100%; box-sizing:border-box; padding:14px; font-size:16px; color:#ECE8DF;
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:12px; outline:none; }
  input:focus { border-color:#00A152; }
  button { width:100%; margin-top:22px; padding:15px; font-size:15px; font-weight:600; color:#fff; border:0;
    border-radius:12px; background:linear-gradient(180deg,#00A152,#007A3D); }
  #res { margin-top:16px; font-size:14px; line-height:1.5; word-break:break-word; }
  .erro { color:#E0525C; }
  .cod { font-size:22px; letter-spacing:2px; color:#B89B5E; font-weight:700; margin:8px 0; }
</style>
</head>
<body>
  <form id="f" autocomplete="off">
    <h1>Criar conta de comando</h1>
    <label for="chave">Chave de instalação</label>
    <input id="chave" type="password">
    <label for="mat">Matrícula</label>
    <input id="mat">
    <label for="nome">Nome</label>
    <input id="nome">
    <label for="sen">Senha (mínimo 8 caracteres)</label>
    <input id="sen" type="password">
    <button type="submit">Criar conta</button>
    <div id="res"></div>
  </form>
<script>
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const res = document.getElementById("res");
    res.className = ""; res.textContent = "Criando...";
    try {
      const r = await fetch("/api/setup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chave: document.getElementById("chave").value,
          matricula: document.getElementById("mat").value,
          nome: document.getElementById("nome").value,
          senha: document.getElementById("sen").value
        })
      });
      const d = await r.json();
      if (!r.ok) { res.className = "erro"; res.textContent = d.erro || "Erro"; return; }
      res.textContent = "Conta criada. Guarde seu código de recuperação agora, ele aparece só uma vez:";
      const c = document.createElement("div");
      c.className = "cod"; c.textContent = d.codigo_recuperacao;
      res.appendChild(c);
    } catch (err) {
      res.className = "erro"; res.textContent = "Falha de conexão";
    }
  };
</script>
</body>
</html>
