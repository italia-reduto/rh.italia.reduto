<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090B0A"><meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Dossiê · Itália RH</title>
<link rel="stylesheet" href="/estilo.css">
<style>
  body { align-items: flex-start; padding-top: 40px; padding-bottom: 40px; }
  .voltar { color: var(--suave); text-decoration: none; font-size: 13px; display: block; margin-bottom: 16px; }
  
  /* Crachá */
  .cracha { background: var(--cartao); border: 1px solid var(--linha); border-radius: 20px; padding: 24px; text-align: center; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .cracha::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--verde), var(--ouro), #CE2B37); }
  .avatar-grande { width: 80px; height: 80px; border-radius: 50%; background: var(--verde); color: #000; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 0 20px rgba(0,161,82,0.3); }
  .cracha h2 { margin: 0; font-size: 24px; color: var(--marfim); font-family: Georgia, serif; }
  .cracha .cargo-txt { color: var(--verde); font-size: 14px; margin: 4px 0; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .cracha .mat-txt { color: var(--ouro); font-size: 13px; font-weight: bold; }
  
  /* Dados do Jogo (Discord / Game ID) */
  .dados-jogo { display: flex; gap: 10px; margin-top: 16px; }
  .dado-box { flex: 1; background: rgba(255,255,255,0.02); border: 1px solid var(--linha); border-radius: 12px; padding: 12px; text-align: center; }
  .dado-box small { display: block; font-size: 10px; color: var(--suave); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .dado-box span { font-size: 14px; color: var(--marfim); font-weight: 600; word-break: break-all; }

  /* Estatísticas */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .stat-box { background: rgba(255,255,255,0.02); border: 1px solid var(--linha); border-radius: 14px; padding: 16px; text-align: center; }
  .stat-box span { display: block; font-size: 24px; font-weight: bold; color: var(--marfim); }
  .stat-box small { font-size: 11px; color: var(--suave); text-transform: uppercase; letter-spacing: 1px; }
  .stat-box.tickets span { color: #5E9BFF; }
  .stat-box.ausencias span { color: var(--ouro); }
  .stat-box.elogios span { color: var(--verde); }
  .stat-box.advertencias span { color: var(--vermelho); }

  /* Status de Treinamento e Geral */
  .status-treinamento { margin-top: 10px; background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
  .status-treinamento b { color: var(--marfim); font-size: 14px; }
  .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
  .badge.Pendente, .badge.Inativo { background: rgba(224,82,92,.15); color: var(--vermelho); }
  .badge.Concluído, .badge.Ativo { background: rgba(0,161,82,.15); color: var(--verde); }

  /* Painel do Admin */
  .admin-panel { margin-top: 20px; background: rgba(184,155,94,.05); border: 1px dashed var(--ouro); border-radius: 14px; padding: 20px; display: none; }
  .admin-panel h3 { margin: 0 0 16px; color: var(--ouro); font-size: 16px; border-bottom: 1px solid rgba(184,155,94,.2); padding-bottom: 8px; }
  .admin-panel label { color: var(--ouro); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; display: block; margin-top: 12px; margin-bottom: 4px; }
  .admin-panel input, .admin-panel select, .admin-panel textarea { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid rgba(184,155,94,.3); background: #000; color: #fff; font-family: inherit; outline: none; }
  .admin-panel input:focus, .admin-panel select:focus, .admin-panel textarea:focus { border-color: var(--ouro); box-shadow: 0 0 0 2px rgba(184,155,94,.2); }
  .admin-row { display: flex; gap: 10px; }
  .admin-row > div { flex: 1; }
  
  /* Busca de Admin */
  .busca-box { display: none; margin-bottom: 16px; background: var(--cartao); padding: 16px; border-radius: 14px; border: 1px solid var(--linha); }
  .busca-box input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid var(--linha); background: #000; color: #fff; margin-bottom: 8px; }
  .busca-box button { width: 100%; padding: 12px; background: var(--ouro); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
  <div class="caixa">
    <a href="/painel.html" class="voltar">&larr; Voltar ao painel</a>

    <div class="busca-box" id="buscaAdmin">
      <label style="color:var(--ouro); font-size:12px; font-weight:bold; margin-bottom:4px; display:block;">BUSCAR MEMBRO (ADMIN)</label>
      <input type="text" id="buscaMatricula" placeholder="Digite a matrícula...">
      <button onclick="buscarMembro()">BUSCAR FICHA</button>
    </div>

    <div class="cracha" id="cracha" hidden>
      <div class="avatar-grande" id="avatar">?</div>
      <h2 id="f-nome">Carregando...</h2>
      <div class="cargo-txt" id="f-cargo">-</div>
      <div class="mat-txt" id="f-matricula">-</div>
      
      <div class="dados-jogo">
        <div class="dado-box"><small>Discord</small><span id="f-discord">-</span></div>
        <div class="dado-box"><small>Game ID</small><span id="f-gameid">-</span></div>
      </div>
    </div>

    <div class="stats-grid" id="stats" hidden>
      <div class="stat-box tickets"><span id="s-tickets">0</span><small>Tickets</small></div>
      <div class="stat-box ausencias"><span id="s-ausencias">0</span><small>Ausências</small></div>
      <div class="stat-box elogios"><span id="s-elogios">0</span><small>Elogios</small></div>
      <div class="stat-box advertencias"><span id="s-advertencias">0</span><small>Advertências</small></div>
    </div>

    <div class="status-treinamento" id="statusGeral" hidden>
      <b>Status na Org</b>
      <span class="badge" id="f-status">-</span>
    </div>

    <div class="status-treinamento" id="statusTreinamento" hidden>
      <b>Treinamento</b>
      <span class="badge" id="f-treinamento">-</span>
    </div>

    <div class="status-treinamento" id="boxObservacoes" hidden style="display:block;">
      <b style="display:block; margin-bottom:8px;">Notas do Comando</b>
      <p id="f-observacoes" style="margin:0; font-size:13px; color:var(--suave); line-height:1.5; white-space: pre-wrap;">Nenhuma observação registrada.</p>
    </div>

    <div class="admin-panel" id="adminEditar">
      <h3>Gestão de Efetivo</h3>
      
      <div class="admin-row">
        <div>
          <label>Advertências</label>
          <input type="number" id="edit-adv" value="0" min="0">
        </div>
        <div>
          <label>Elogios</label>
          <input type="number" id="edit-elo" value="0" min="0">
        </div>
      </div>

      <div class="admin-row">
        <div>
          <label>Status</label>
          <select id="edit-status">
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
            <option value="Licença">Licença</option>
          </select>
        </div>
        <div>
          <label>Treinamento</label>
          <select id="edit-tre">
            <option value="Pendente">Pendente</option>
            <option value="Concluído">Concluído</option>
          </select>
        </div>
      </div>

      <label>ID do Discord</label>
      <input type="text" id="edit-discord" placeholder="Ex: falcao#1234">

      <label>ID no Jogo</label>
      <input type="text" id="edit-gameid" placeholder="Ex: 12345">

      <label>Anotações do Comando</label>
      <textarea id="edit-obs" placeholder="Histórico, punições anteriores..." rows="4"></textarea>

      <button class="btn" onclick="salvarEdicao()" style="background:var(--ouro); color:#000; margin-top:20px;">SALVAR ALTERAÇÕES</button>
    </div>
  </div>
  <script src="/ui.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let isAdmin = false;
  let matriculaAtual = "";

  // 1. Verifica quem é o usuário
  fetch("/api/me").then(async (r) => {
    if (!r.ok) { location.href = "/"; return; }
    const d = await r.json();
    
    if (d.trocar_senha) { location.href = "/trocar-senha.html"; return; }
    
    isAdmin = d.nivel >= 50;
    matriculaAtual = d.matricula;

    if (isAdmin) {
      $("buscaAdmin").style.display = "block";
    }
    
    carregarFicha(d.matricula);
  }).catch(() => { location.href = "/"; });

  // 2. Carrega os dados da ficha
  async function carregarFicha(matricula) {
    // Esconde tudo antes de carregar
    $("cracha").hidden = true;
    $("stats").hidden = true;
    $("statusGeral").hidden = true;
    $("statusTreinamento").hidden = true;
    $("boxObservacoes").hidden = true;
    $("adminEditar").style.display = "none";

    try {
      const url = (isAdmin && matricula !== matriculaAtual) ? `/api/admin/ficha?matricula=${matricula}` : "/api/ficha";
      const r = await fetch(url);
      const d = await r.json();

      if (!r.ok) {
        customAlert(d.erro || "Erro ao buscar ficha", "Erro");
        return;
      }

      const f = d.ficha;
      
      // Preenche o Crachá e Dados
      $("avatar").textContent = f.nome.charAt(0).toUpperCase();
      $("f-nome").textContent = f.nome;
      $("f-cargo").textContent = f.cargo;
      $("f-matricula").textContent = "Matrícula: " + f.matricula;
      $("f-discord").textContent = f.discord_id || "-";
      $("f-gameid").textContent = f.game_id || "-";
      
      // Preenche Estatísticas
      $("s-tickets").textContent = d.stats.tickets;
      $("s-ausencias").textContent = d.stats.ausencias;
      $("s-elogios").textContent = f.elogios || 0;
      $("s-advertencias").textContent = f.advertencias || 0;
      
      // Preenche Status
      const status = f.status || 'Ativo';
      $("f-status").textContent = status;
      $("f-status").className = "badge " + status;

      const tre = f.treinamento_status || 'Pendente';
      $("f-treinamento").textContent = tre;
      $("f-treinamento").className = "badge " + tre;

      // Observações
      if (f.observacoes && f.observacoes.trim() !== "") {
        $("f-observacoes").textContent = f.observacoes;
        $("boxObservacoes").hidden = false;
      }

      // Se for Admin, preenche o painel de edição
      if (isAdmin) {
        $("edit-adv").value = f.advertencias || 0;
        $("edit-elo").value = f.elogios || 0;
        $("edit-status").value = status;
        $("edit-tre").value = tre;
        $("edit-discord").value = f.discord_id || "";
        $("edit-gameid").value = f.game_id || "";
        $("edit-obs").value = f.observacoes || "";
        
        $("adminEditar").style.display = "block";
        matriculaAtual = f.matricula; // Trava a matrícula atual para o save
      }

      // Mostra os blocos
      $("cracha").hidden = false;
      $("stats").hidden = false;
      $("statusGeral").hidden = false;
      $("statusTreinamento").hidden = false;

    } catch (e) {
      customAlert("Falha de conexão", "Erro");
    }
  }

  // 3. Buscar membro (Admin)
  function buscarMembro() {
    const mat = $("buscaMatricula").value.trim();
    if (!mat) { customAlert("Digite uma matrícula.", "Aviso"); return; }
    carregarFicha(mat);
  }

  // 4. Salvar edições (Admin)
  async function salvarEdicao() {
    const confirmou = await customConfirm("Deseja salvar as alterações nesta ficha?", "Confirmar Edição");
    if (!confirmou) return;

    try {
      const r = await fetch("/api/admin/ficha/editar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          matricula: matriculaAtual,
          advertencias: $("edit-adv").value,
          elogios: $("edit-elo").value,
          status: $("edit-status").value,
          treinamento_status: $("edit-tre").value,
          discord_id: $("edit-discord").value,
          game_id: $("edit-gameid").value,
          observacoes: $("edit-obs").value
        })
      });
      const d = await r.json();

      if (r.ok) {
        customAlert("Ficha atualizada com sucesso!", "Sucesso");
        carregarFicha(matriculaAtual);
      } else {
        customAlert(d.erro || "Erro ao salvar", "Erro");
      }
    } catch (e) {
      customAlert("Falha de conexão", "Erro");
    }
  }
</script>
</body>
</html>
