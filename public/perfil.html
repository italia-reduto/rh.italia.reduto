<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090B0A"><meta name="color-scheme" content="dark">
<title>Meu Perfil · Itália RH</title>
<link rel="stylesheet" href="/estilo.css">
<style>
  body { align-items: flex-start; padding-top: 100px; }
  .foto-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
  .foto-preview { width: 120px; height: 120px; border-radius: 24px; background: var(--cartao); border: 2px solid var(--verde); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; color: var(--verde); overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,161,82,0.2); }
  .foto-preview img { width: 100%; height: 100%; object-fit: cover; }
  .btn-foto { margin-top: 16px; background: var(--cartao); border: 1px solid var(--verde); color: var(--verde); padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn-foto input { display: none; }
</style>
</head>
<body>
  <script src="/topbar.js"></script>
  
  <div class="caixa">
    <div class="cartao">
      <h2 style="text-align: center; margin-bottom: 24px;">Meu Perfil</h2>
      
      <div class="foto-container">
        <div class="foto-preview" id="preview">
          <span id="letra">?</span>
        </div>
        
        <label class="btn-foto">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Alterar Foto
          <input type="file" id="inputFoto" accept="image/*" onchange="processarImagem(this)">
        </label>
      </div>

      <div class="msg" id="msg" style="text-align: center;"></div>
      <a href="/painel.html" class="link" style="margin-top: 20px;">Voltar ao painel</a>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  // 1. Carrega a foto atual (se existir)
  fetch("/api/me").then(async (r) => {
    if (!r.ok) { location.href = "/"; return; }
    const d = await r.json();
    
    if (d.avatar_base64) {
      $("preview").innerHTML = `<img src="${d.avatar_base64}" alt="Avatar">`;
    } else {
      $("letra").textContent = d.nome.charAt(0).toUpperCase();
    }
  });

  // 2. Processa a imagem selecionada (Redimensiona e Comprime)
  function processarImagem(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const msg = $("msg");

    if (!file.type.startsWith("image/")) {
      msg.textContent = "Por favor, selecione uma imagem.";
      msg.style.color = "var(--vermelho)";
      return;
    }

    msg.textContent = "Processando imagem...";
    msg.style.color = "var(--suave)";

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        // Redimensiona para 200x200 para não estourar o D1
        const canvas = document.createElement("canvas");
        const MAX_SIZE = 200;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > MAX_SIZE) {
            height *= MAX_SIZE / width;
            width = MAX_SIZE;
          }
        } else {
          if (height > MAX_SIZE) {
            width *= MAX_SIZE / height;
            height = MAX_SIZE;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        // Converte para JPEG com qualidade 0.8 (bem leve)
        const base64 = canvas.toDataURL("image/jpeg", 0.8);
        
        // Mostra no preview
        $("preview").innerHTML = `<img src="${base64}" alt="Avatar">`;
        
        // Envia para o servidor
        salvarFoto(base64);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 3. Salva no banco
  async function salvarFoto(base64) {
    const msg = $("msg");
    msg.textContent = "Salvando...";
    msg.style.color = "var(--ouro)";

    try {
      const r = await fetch("/api/perfil/foto", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imagem: base64 })
      });
      const d = await r.json();

      if (r.ok) {
        msg.textContent = "Foto atualizada com sucesso!";
        msg.style.color = "var(--verde)";
      } else {
        msg.textContent = d.erro || "Erro ao salvar.";
        msg.style.color = "var(--vermelho)";
      }
    } catch (e) {
      msg.textContent = "Falha de conexão.";
      msg.style.color = "var(--vermelho)";
    }
  }
</script>
</body>
</html>
