<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1110"><meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Meu perfil · Itália RH</title>
<style>
  :root{--bg:#0E1110;--card:#171C19;--verde:#35E08A;--esc:#06281A;--suave:#8C9690;--texto:#F2F2EE;--coral:#FF7A6B;--linha:rgba(255,255,255,.08)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
  .tela{max-width:440px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:24px;padding:24px 16px;text-align:center}
  h1{margin:0 0 20px;font-size:20px;font-weight:600}
  .foto{width:132px;height:132px;margin:0 auto;border-radius:30px;background:#12261D;border:2px solid var(--verde);color:var(--verde);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:600;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .nome{margin-top:14px;font-size:17px;font-weight:600}
  .sub{margin-top:2px;font-size:13px;color:var(--suave)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;padding:13px 22px;border-radius:30px;background:var(--verde);color:var(--esc);font-size:14px;font-weight:600;cursor:pointer}
  .btn input{display:none}
  .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn.off{opacity:.6;pointer-events:none}
  .msg{min-height:20px;margin-top:14px;font-size:13px;color:var(--suave)}
  .msg.ok{color:var(--verde)} .msg.erro{color:var(--coral)}
  .lista{margin-top:12px;background:var(--card);border-radius:24px;overflow:hidden}
  .lista a{display:flex;justify-content:space-between;align-items:center;padding:16px;color:var(--texto);text-decoration:none;font-size:14px;border-bottom:1px solid var(--linha)}
  .lista a:last-child{border-bottom:0}
  .lista span{color:var(--suave)}
</style>
</head>
<body>
<script src="/topbar.js"></script>
<div class="tela">
  <div class="card">
    <h1>Meu perfil</h1>
    <div class="foto" id="foto"><span>?</span></div>
    <div class="nome" id="nome"></div>
    <div class="sub" id="sub"></div>
    <label class="btn" id="lblFoto">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Alterar foto
      <input type="file" id="arquivo" accept="image/*">
    </label>
    <div class="msg" id="msg"></div>
  </div>
  <div class="lista">
    <a href="/trocar-senha.html">Trocar minha senha <span>›</span></a>
    <a href="/ficha.html">Minha ficha <span>›</span></a>
    <a href="/painel.html">Voltar ao painel <span>›</span></a>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const aviso = (t, c) => { $("msg").textContent = t; $("msg").className = "msg " + (c || ""); };
  const FOTO_OK = /^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+\/=]+$/;

  function mostrar(src, nome) {
    const f = $("foto");
    while (f.firstChild) f.removeChild(f.firstChild);
    if (src && FOTO_OK.test(src)) {
      const i = document.createElement("img");
      i.src = src; i.alt = "Foto de perfil";
      f.appendChild(i);
    } else {
      const s = document.createElement("span");
      s.textContent = String(nome || "?").charAt(0).toUpperCase();
      f.appendChild(s);
    }
  }

  fetch("/api/me").then(async (r) => {
    if (!r.ok) { location.href = "/"; return; }
    const d = await r.json();
    if (d.trocar_senha) { location.href = "/trocar-senha.html"; return; }
    $("nome").textContent = d.nome;
    $("sub").textContent = d.cargo + " · Mat. " + d.matricula;
    mostrar(d.avatar_base64, d.nome);
  }).catch(() => { location.href = "/"; });

  $("arquivo").onchange = function () {
    const arq = this.files && this.files[0];
    if (!arq) return;
    if (!arq.type.startsWith("image/")) { aviso("Escolha uma imagem.", "erro"); return; }
    if (arq.size > 15 * 1024 * 1024) { aviso("Imagem grande demais (máx. 15 MB).", "erro"); return; }
    aviso("Processando...");
    const url = URL.createObjectURL(arq);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); aviso("Não consegui abrir essa imagem. Use JPG, PNG ou WebP.", "erro"); };
    img.onload = async () => {
      URL.revokeObjectURL(url);
      const lado = Math.min(img.naturalWidth, img.naturalHeight);
      if (!lado) { aviso("Imagem inválida.", "erro"); return; }
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const x = (img.naturalWidth - lado) / 2, y = (img.naturalHeight - lado) / 2;
      c.getContext("2d").drawImage(img, x, y, lado, lado, 0, 0, 256, 256);
      const b64 = c.toDataURL("image/jpeg", 0.85);
      $("lblFoto").classList.add("off");
      try {
        const r = await fetch("/api/perfil/foto", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imagem: b64 })
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok) { mostrar(b64, $("nome").textContent); aviso("Foto atualizada!", "ok"); setTimeout(() => location.reload(), 900); }
        else aviso(d.erro || "Erro ao salvar.", "erro");
      } catch (e) { aviso("Falha de conexão.", "erro"); }
      $("lblFoto").classList.remove("off");
    };
    img.src = url;
  };
</script>
</body>
</html>
