<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090B0A"><meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Frequência da Equipe · Itália RH</title>
<link rel="stylesheet" href="/estilo.css">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body { align-items: flex-start; padding-top: 90px; padding-bottom: 40px; background-color: var(--fundo); }
  
  .card { background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  
  .date-picker { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--linha); background: #000; color: #fff; font-size: 16px; outline: none; margin-bottom: 10px; }
  .date-picker:focus { border-color: var(--verde); }

  .membro-item { display: flex; justify-content: space-between; align-items: flex-start; background: rgba(255,255,255,.02); border: 1px solid var(--linha); padding: 16px; border-radius: 12px; margin-bottom: 10px; }
  .membro-info { display: flex; flex-direction: column; gap: 4px; }
  .membro-nome { font-size: 15px; font-weight: 600; color: var(--marfim); }
  .membro-mat { font-size: 12px; color: var(--suave); }
  .membro-horario { font-size: 11px; color: var(--ouro); margin-top: 4px; background: rgba(184,155,94,0.1); padding: 2px 6px; border-radius: 4px; display: inline-block; width: fit-content; }

  .botoes { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-status { width: 40px; height: 40px; border-radius: 8px; border: 1px solid; background: transparent; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  
  .btn-p { color: var(--verde); border-color: rgba(0,161,82,0.5); }
  .btn-p.ativo { background: var(--verde); color: #000; }
  
  .btn-f { color: var(--vermelho); border-color: rgba(224,82,92,0.5); }
  .btn-f.ativo { background: var(--vermelho); color: #fff; }
  
  .btn-j { color: var(--ouro); border-color: rgba(184,155,94,0.5); }
  .btn-j.ativo { background: var(--ouro); color: #000; }

  .subtitulo { font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
</style>
</head>
<body>
  <script src="/topbar.js"></script>

  <div class="caixa">
    <h2 style="margin-bottom: 20px;">Frequência da Equipe</h2>
    
    <!-- Seletor de Data -->
    <div class="card">
      <label class="subtitulo">Selecione o dia</label>
      <input type="date" id="dataFiltro" class="date-picker" onchange="carregarDia()">
      <div id="resumoDia" class="sub" style="margin-top: 10px;">Selecione uma data para ver os membros.</div>
    </div>

    <!-- Lista de Membros -->
    <div id="listaMembros"></div>
  </div>

<script>
  fetch("/api/me").then(async (r) => {
    if (!r.ok) { location.href = "/"; return; }
    const d = await r.json();
    if (d.nivel < 50) { location.href = "/painel.html"; return; }
    
    // Define a data de hoje por padrão
    const hoje = new Date().toISOString().split("T")[0];
    document.getElementById("dataFiltro").value = hoje;
    carregarDia();
  }).catch(() => { location.href = "/"; });

  let membrosAtuais = [];
  let frequenciasAtuais = [];

  async function carregarDia() {
    const data = document.getElementById("dataFiltro").value;
    if (!data) return;

    const lista = document.getElementById("listaMembros");
    const resumo = document.getElementById("resumoDia");
    lista.innerHTML = '<p class="sub">Buscando registros...</p>';

    try {
      const r = await fetch(`/api/admin/frequencia/dia?data=${data}`);
      const d = await r.json();

      if (!r.ok) {
        lista.innerHTML = `<p class="sub" style="color:var(--vermelho)">${d.erro || 'Erro ao buscar'}</p>`;
        return;
      }

      membrosAtuais = d.membros;
      frequenciasAtuais = d.frequencias;

      if (membrosAtuais.length === 0) {
        resumo.textContent = "Nenhum membro bateu ponto neste dia.";
        lista.innerHTML = "";
        return;
      }

      resumo.textContent = `${membrosAtuais.length} membro(s) em serviço neste dia.`;
      renderizarLista();

    } catch (e) {
      lista.innerHTML = '<p class="sub" style="color:var(--vermelho)">Falha de conexão.</p>';
    }
  }

  function renderizarLista() {
    const lista = document.getElementById("listaMembros");
    lista.innerHTML = "";

    membrosAtuais.forEach(m => {
      // Verifica se já tem frequência lançada para esse membro
      const freq = frequenciasAtuais.find(f => f.membro_id === m.id);
      const statusAtual = freq ? freq.status : ""; // Falta, Presença, Justificada

      const entrada = new Date(m.entrada * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const saida = m.saida ? new Date(m.saida * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : 'Em serviço';

      const div = document.createElement("div");
      div.className = "membro-item";

      // Classes dos botões
      const classP = statusAtual === "Presença" ? "btn-status btn-p ativo" : "btn-status btn-p";
      const classF = statusAtual === "Falta" ? "btn-status btn-f ativo" : "btn-status btn-f";
      const classJ = statusAtual === "Justificada" ? "btn-status btn-j ativo" : "btn-status btn-j";

      div.innerHTML = `
        <div class="membro-info">
          <span class="membro-nome">${m.nome}</span>
          <span class="membro-mat">Passaporte: ${m.matricula}</span>
          <span class="membro-horario">${entrada} às ${saida}</span>
        </div>
        <div class="botoes">
          <button class="${classP}" onclick="lancar(${m.matricula}, 'Presença')">P</button>
          <button class="${classF}" onclick="lancar(${m.matricula}, 'Falta')">F</button>
          <button class="${classJ}" onclick="lancar(${m.matricula}, 'Justificada')">J</button>
        </div>
      `;
      lista.appendChild(div);
    });
  }

  async function lancar(matricula, status) {
    const data = document.getElementById("dataFiltro").value;
    
    // Confirmação
    const ok = await customConfirm(`Deseja marcar ${status} para a matrícula ${matricula}?`, "Confirmar");
    if (!ok) return;

    try {
      const r = await fetch("/api/admin/frequencia/lancar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          matricula: matricula,
          tipo: "Ponto", // Como ele bateu ponto, o tipo padrão é ponto
          status: status,
          data: data
        })
      });
      const d = await r.json();
      
      if (r.ok) {
        customAlert("Frequência registrada!", "Sucesso");
        carregarDia(); // Recarrega a lista para atualizar os botões
      } else {
        customAlert(d.erro || "Erro ao registrar", "Erro");
      }
    } catch (e) {
      customAlert("Falha de conexão.", "Erro");
    }
  }
</script>
</body>
</html>
