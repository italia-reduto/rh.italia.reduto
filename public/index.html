<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itália · Recursos Humanos</title>
<style>
  :root {
    --fundo: #0B1A14; --cartao: #12261D; --borda: #1F3B2D;
    --verde: #009246; --creme: #F4EFE3; --ouro: #C8A24A; --vermelho: #CE2B37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--fundo); color: var(--creme);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 20px;
  }
  .caixa { width: 100%; max-width: 420px; }
  .marca { text-align: center; margin-bottom: 22px; }
  .marca small { color: var(--ouro); letter-spacing: 4px; font-size: 12px; font-weight: 700; }
  .marca h1 { margin: 6px 0 0; font-size: 34px; letter-spacing: 3px; }
  .cartao {
    background: var(--cartao); border: 1px solid var(--borda);
    border-radius: 18px; overflow: hidden;
  }
  .faixa { display: flex; height: 6px; }
  .faixa i { flex: 1; }
  .faixa i:nth-child(1) { background: var(--verde); }
  .faixa i:nth-child(2) { background: var(--creme); }
  .faixa i:nth-child(3) { background: var(--vermelho); }
  form { padding: 26px 22px 24px; }
  h2 { margin: 0 0 4px; font-size: 24px; }
  p.sub { margin: 0 0 22px; color: #A9B8AE; font-size: 14px; }
  label { display: block; margin: 14px 0 6px; font-size: 13px; color: var(--ouro); font-weight: 600; }
  .campo { position: relative; }
  input {
    width: 100%; padding: 14px; font-size: 16px; color: var(--creme);
    background: #0B1A14; border: 1px solid var(--borda); border-radius: 12px; outline: none;
  }
  input:focus { border-color: var(--verde); }
  .olho {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: #A9B8AE; font-size: 13px; padding: 8px; cursor: pointer;
  }
  button.entrar {
    width: 100%; margin-top: 22px; padding: 15px; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--verde); border: 0; border-radius: 12px; cursor: pointer;
  }
  button.entrar:active { opacity: .85; }
  #msg { min-height: 20px; margin-top: 14px; font-size: 13px; text-align: center; color: var(--vermelho); }
  .rodape { margin-top: 18px; text-align: center; font-size: 12px; color: #7F9185; }
</style>
</head>
<body>
  <div class="caixa">
    <div class="marca">
      <small>RECURSOS HUMANOS</small>
      <h1>ITÁLIA</h1>
    </div>
    <div class="cartao">
      <div class="faixa"><i></i><i></i><i></i></div>
      <form id="form" autocomplete="off">
        <h2>Acesso ao sistema</h2>
        <p class="sub">Entre com sua matrícula e senha.</p>
        <label for="mat">Matrícula</label>
        <div class="campo"><input id="mat" inputmode="numeric" placeholder="Sua matrícula"></div>
        <label for="sen">Senha</label>
        <div class="campo">
          <input id="sen" type="password" placeholder="Sua senha">
          <button type="button" class="olho" id="olho">Mostrar</button>
        </div>
        <button class="entrar" type="submit">Entrar</button>
        <div id="msg"></div>
      </form>
    </div>
    <div class="rodape">Acesso restrito ao efetivo · uso monitorado</div>
  </div>
<script>
  const sen = document.getElementById("sen");
  const olho = document.getElementById("olho");
  olho.onclick = () => {
    const ver = sen.type === "password";
    sen.type = ver ? "text" : "password";
    olho.textContent = ver ? "Ocultar" : "Mostrar";
  };
  document.getElementById("form").onsubmit = (e) => {
    e.preventDefault();
    document.getElementById("msg").textContent = "Login será ativado no próximo passo.";
  };
</script>
</body>
</html>
