<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090B0A">
<title>Itália · Recursos Humanos</title>
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <div class="caixa">
    <div class="marca">
      <div class="emblema">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7.3L12 17.8 5.7 21.5l1.7-7.3L2 9.5l7.1-.6z"/></svg>
      </div>
      <small>RECURSOS HUMANOS</small>
      <h1>ITÁLIA</h1>
      <div class="fio"><i></i><i></i><i></i></div>
    </div>
    <div class="cartao">
      <form id="form" autocomplete="off">
        <h2>Acesso ao sistema</h2>
        <p class="sub">Entre com sua matrícula e senha.</p>
        <label for="mat">Matrícula</label>
        <div class="campo"><input id="mat" type="text" placeholder="Sua matrícula"></div>
        <label for="sen">Senha</label>
        <div class="campo">
          <input id="sen" type="password" placeholder="Sua senha">
          <button type="button" class="olho" id="olho">Mostrar</button>
        </div>
        <label class="check" style="text-transform:none;letter-spacing:0;font-size:13px;margin:18px 0 0">
          <input type="checkbox" id="aut">
          <span>Autorizar recuperação neste aparelho pessoal</span>
        </label>
        <button class="btn" id="entrar" type="submit">ENTRAR</button>
        <div class="msg" id="msg"></div>
        <a class="link" href="/recuperar.html">Esqueci minha senha</a>
      </form>
      <form id="pinform" autocomplete="off" hidden>
        <h2>Crie seu PIN</h2>
        <p class="sub">Escolha 6 números. Com ele você recupera sua senha neste aparelho. Não use data de nascimento.</p>
        <label for="pin">PIN de recuperação</label>
        <div class="campo"><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="6 números"></div>
        <button class="btn" type="submit">SALVAR PIN</button>
        <button class="btn-sec" type="button" id="pular">Agora não</button>
        <div class="msg" id="msgpin"></div>
      </form>
    </div>
    <div class="rodape">ACESSO RESTRITO AO EFETIVO · USO MONITORADO</div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const sen = $("sen");
  $("olho").onclick = () => {
    const ver = sen.type === "password";
    sen.type = ver ? "text" : "password";
    $("olho").textContent = ver ? "Ocultar" : "Mostrar";
  };
  async function enviar(url, corpo) {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo)
    });
    let d = {};
    try { d = await r.json(); } catch (e) {}
    return { ok: r.ok, d };
  }
  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const msg = $("msg"), btn = $("entrar");
    msg.textContent = "";
    btn.disabled = true;
    try {
      const { ok, d } = await enviar("/api/login", { matricula: $("mat").value, senha: sen.value });
      if (ok) {
        if (d.trocar_senha) { location.href = "/trocar-senha.html"; return; }
        if ($("aut").checked) {
          $("form").hidden = true;
          $("pinform").hidden = false;
          $("pin").focus();
          return;
        }
        location.href = "/painel.html";
        return;
      }
      msg.textContent = d.erro || "Não foi possível entrar";
    } catch (err) {
      msg.textContent = "Falha de conexão";
    }
    btn.disabled = false;
  };
  $("pinform").onsubmit = async (e) => {
    e.preventDefault();
    const msg = $("msgpin");
    msg.textContent = "";
    try {
      const { ok, d } = await enviar("/api/aparelho/autorizar", { pin: $("pin").value });
      if (ok) { location.href = "/painel.html"; return; }
      msg.textContent = d.erro || "Não foi possível salvar o PIN";
    } catch (err) {
      msg.textContent = "Falha de conexão";
    }
  };
  $("pular").onclick = () => { location.href = "/painel.html"; };
</script>
</body>
</html>
